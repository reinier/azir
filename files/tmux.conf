# Azir's tmux status bar colour (parity backlog 0024). Each machine and VM in
# config-nixos's tmux.nix has its own, so a session (often over ssh) shows where it runs:
# brown for Azir, from the GNOME palette like the rest. Per OS, not per machine.
# ~/.tmux.conf still loads after this.
set -g status-style "bg=#865e3c,fg=#ffffff"
