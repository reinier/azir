# Portal routing for the Umbriel session (XDG_CURRENT_DESKTOP=Umbriel), replacing the
# xdg-desktop-portal-umbriel build's own file, which only says default=umbriel;gtk. With
# nothing serving the Secret portal, Chromium-based browsers can't get their encryption key:
# config-nixos saw Edge's sync hang on "setting up sync". Same routing as niri's
# niri-portals.conf: Secret goes to gnome-keyring (its gnome-keyring.portal).
[preferred]
default=umbriel;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
