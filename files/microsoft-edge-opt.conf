# Microsoft Edge ships its payload in /opt/microsoft/msedge; it's baked into
# /usr/lib/opt/microsoft instead (see the Containerfile) so it ships and updates
# with the image. /usr/bin/microsoft-edge{,-stable} and the .desktop Exec= still
# expect /opt/microsoft/msedge, which on this ostree layout resolves through
# /opt -> var/opt. Same pattern as 1password-opt.conf.
d  /var/opt           0755 root root -
L+ /var/opt/microsoft -    -    -    - /usr/lib/opt/microsoft
