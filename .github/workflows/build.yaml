name: Build Azir

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily 06:00 UTC — staggered after Steen (02:00), Tashikk (03:00), and, since the
    # FROM switched to ghcr.io/reinier/roshar, after Roshar's own build too (05:00) —
    # otherwise Azir would rebuild against yesterday's Roshar image every day. Picks up
    # the Roshar base + Fedora security updates + whatever moved in Roshar's own build
    # (Silverblue base, the avengemedia DMS COPR, etc.).
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: azir
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Pull base image (retried — registry pulls can be flaky)
        run: |
          img=ghcr.io/reinier/roshar:latest
          for i in 1 2 3 4 5; do
            if podman pull "$img"; then exit 0; fi
            echo "::warning::base pull attempt $i failed; retrying"
            sleep $((i * 15))
          done
          echo "::error::base pull failed after 5 attempts"
          exit 1

      # jotta-cli is pinned (JOTTA_CLI_VERSION + sha256 in the Containerfile), so a new
      # release never arrives on its own. Warn when Jottacloud's repo has a newer x86_64
      # build, with the values to bump to. Never fails the build.
      - name: Check for a jotta-cli update
        continue-on-error: true
        run: |
          pinned="$(sed -n 's/^ARG JOTTA_CLI_VERSION=//p' Containerfile)"
          base=https://repo.jotta.cloud/redhat
          primary="$(curl -fsSL "$base/repodata/repomd.xml" | grep -o 'repodata/[^"]*primary\.xml\.gz' | head -1)"
          latest="$(curl -fsSL "$base/$primary" | gunzip \
            | grep -A12 '<name>jotta-cli</name>' | grep -A2 '<arch>x86_64</arch>' \
            | grep -oE 'ver="[^"]*"|[0-9a-f]{64}' | sed 's/ver="\(.*\)"/\1/' | paste - - | sort -V | tail -1)"
          read -r ver sha <<<"$latest"
          if [ -z "$ver" ] || [ -z "$pinned" ]; then
            echo "::warning title=jotta-cli check::could not read the versions (pinned '$pinned', repo '$ver')"
          elif [ "$ver" != "$pinned" ] && [ "$(printf '%s\n%s\n' "$pinned" "$ver" | sort -V | tail -1)" = "$ver" ]; then
            echo "::warning title=jotta-cli update::$ver is out (pinned: $pinned). Bump JOTTA_CLI_VERSION=$ver JOTTA_CLI_SHA256=$sha"
          else
            echo "jotta-cli $pinned is the newest in Jottacloud's repo"
          fi

      - name: Build image
        run: podman build --platform=linux/amd64 -f Containerfile -t "${IMAGE_NAME}:latest" .

      - name: Lint
        run: podman run --rm --entrypoint bootc "${IMAGE_NAME}:latest" container lint

      - name: Push (signed with SIGNING_SECRET when available)
        if: github.event_name != 'pull_request'
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman tag "${IMAGE_NAME}:latest" "${REGISTRY}/${IMAGE_NAME}:latest"

          sign_args=()
          if [ -n "${SIGNING_SECRET}" ]; then
            key_file="$(mktemp)"
            printf '%s' "${SIGNING_SECRET}" > "${key_file}"
            trap 'rm -f "${key_file}"' EXIT
            sudo mkdir -p /etc/containers/registries.d
            printf 'docker:\n  %s:\n    use-sigstore-attachments: true\n' "${REGISTRY}" \
              | sudo tee /etc/containers/registries.d/azir.yaml >/dev/null
            sign_args=(--sign-passphrase-file=/dev/null "--sign-by-sigstore-private-key=${key_file}")
          else
            echo "::warning::SIGNING_SECRET not set — pushing UNSIGNED. Azir inherits a sigstoreSigned policy from its roshar base, so 'bootc upgrade' (once on Azir) will REJECT this image until the secret (same key as Steen/Tashikk/Roshar) is configured."
          fi

          podman push "${sign_args[@]}" "${REGISTRY}/${IMAGE_NAME}:latest"
